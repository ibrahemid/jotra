[package]
name = "jotra-ai"
description = "The AI connection of the Jotra editor: key store, HTTP client, model lists, probes, Rewrite and Chat."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[dependencies]
jotra-core = { path = "../jotra-core" }
# `bundled` for the reason jotra-cli and jotra-mcp take it: a binary that links
# this crate may be built where no system libsqlite3 is there to link against.
jotra-storage = { path = "../jotra-storage", features = ["bundled"] }
# The TLS feature is named here rather than arriving through
# tauri-plugin-updater, so the crate builds on its own. `rustls-no-provider`
# keeps aws-lc-rs out of the tree; the `ring` provider is installed at request
# time (`ensure_crypto_provider`). `system-proxy` is what the app's client
# already resolved with.
reqwest = { version = "0.13", default-features = false, features = [
    "stream",
    "json",
    "multipart",
    "rustls-no-provider",
    "system-proxy",
] }
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
] }
futures-util = "0.3"
tokio = { version = "1", default-features = false, features = ["macros", "time"] }
tokio-util = { version = "0.7", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
url = "2"

# The keyring-core API with one store crate per platform, the crates the
# `keyring` crate wraps; taken directly so Linux links the libdbus store alone.
[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
keyring-core = "1"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "1", default-features = false }

# The Secret Service over libdbus, through the `dbus` 0.9 crate tao already
# links on Linux; the zbus store would add zbus 4 beside the tree's zbus 5.
# `crypto-rust` encrypts the session the secret crosses the bus in, without
# OpenSSL.
[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "test-util", "net", "io-util"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }

# Each OS store's tests write an item the way keyring 3 did, through the
# platform API the store crate already links.
[target.'cfg(target_os = "macos")'.dev-dependencies]
security-framework = "3"

[target.'cfg(target_os = "windows")'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
dbus-secret-service = { version = "4.1", features = ["crypto-rust"] }
